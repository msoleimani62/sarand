name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

defaults:
  run:
    # Force bash on every OS in the matrix so shell behavior stays consistent.
    # اجبار bash روی همه سیستم‌عامل‌های ماتریس برای یکسان ماندن رفتار shell.
    shell: bash

jobs:
  quality:
    name: quality (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job in minutes, not run for hours (a Windows
    # job once ran for ~7 hours). Normal runs take about 3-4 minutes.
    # یک تست گیرکرده باید در چند دقیقه job را fail کند، نه ساعت‌ها اجرا شود
    # (یک job ویندوز یک‌بار حدود ۷ ساعت اجرا شد). اجرای عادی حدود ۳-۴ دقیقه است.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every OS on one Python, plus the oldest and newest supported Python
        # on Linux -- `requires-python` is >=3.10, so 3.10 must really work.
        # ubuntu is pinned so the "ubuntu-latest" migration to a new release
        # cannot change results by surprise; bump it deliberately.
        # هر OS روی یک نسخه‌ی پایتون، به‌علاوه‌ی قدیمی‌ترین و جدیدترین پایتونِ
        # پشتیبانی‌شده روی Linux -- `requires-python` برابر >=3.10 است، پس
        # 3.10 باید واقعاً کار کند. ubuntu ثابت شده تا مهاجرت "ubuntu-latest"
        # به نسخه‌ی جدید نتایج را ناگهانی عوض نکند؛ عمداً ارتقایش بده.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python tooling
        # ".[dev]" is pyproject.toml's single source of truth for which
        # tools CI (and any human) needs -- see the comment next to it.
        # ".[dev]" منبع واحد pyproject.toml برای این است که CI (و هر
        # انسانی) به چه ابزارهایی نیاز دارد -- کامنت کنار آن را ببینید.
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy .

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Run Rust tests
        run: cargo test

      - name: Run Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build the release wheel
        # Build the actual distributable artifact before testing the installed package.
        # ساخت artifact واقعی قابل توزیع قبل از تست کردن package نصب‌شده.
        run: maturin build --release --out dist

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Run the full Python test suite
        # Plain pytest runs the complete suite, including slow_external tests.
        # اجرای ساده pytest کل suite را شامل تست‌های slow_external اجرا می‌کند.
        # `faulthandler_timeout` prints every thread's stack if one test runs
        # longer than 90 s, so a hang names its own culprit in the log.
        # `faulthandler_timeout` اگر یک تست بیش از ۹۰ ثانیه طول بکشد stack همه‌ی
        # threadها را چاپ می‌کند، تا گیرکردن خودش مقصرش را در لاگ نشان دهد.
        run: pytest -v -o faulthandler_timeout=90

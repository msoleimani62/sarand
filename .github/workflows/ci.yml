name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

# Least privilege: no job here needs to write to the repository.
# کمترین دسترسی: هیچ jobای اینجا نیاز ندارد در مخزن بنویسد.
permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. A push to
# main is never cancelled, so every commit on main gets its full result.
# push جدید روی همان pull request اجرای قبلی را کنار می‌گذارد؛ push روی main
# هرگز لغو نمی‌شود.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Force bash on every OS in the matrix so shell behavior stays consistent.
    # اجبار bash روی همه سیستم‌عامل‌های ماتریس برای یکسان ماندن رفتار shell.
    shell: bash

jobs:
  msrv:
    # The Rust version declared in Cargo.toml (`rust-version`) must really
    # build the crate; `--locked` checks the versions pinned in Cargo.lock.
    # نسخه‌ی Rust اعلام‌شده در Cargo.toml باید واقعاً crate را بسازد.
    name: msrv (Rust 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up the minimum Rust version
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.88"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: cargo check with the declared minimum
        run: cargo check --locked --all-targets

  pdf:
    name: PDF engines (real ones)
    # Every other PDF test uses a fake engine. This job installs the real
    # ones and both must render a PDF. The first run (history 5.82) showed
    # that Ubuntu 24.04's wkhtmltopdf needs no X server, so there is no xvfb.
    # هر دو موتور واقعی باید PDF بسازند؛ wkhtmltopdf در Ubuntu 24.04 به X server نیاز ندارد.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install sarand and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev]" weasyprint

      - id: weasy
        name: WeasyPrint renders a real PDF
        env:
          SARAND_REAL_PDF_ENGINES: weasyprint
        run: python -m pytest -q tests/test_pdf_real_engines.py

      - name: Install wkhtmltopdf
        run: sudo apt-get install -y --no-install-recommends wkhtmltopdf

      - name: wkhtmltopdf renders a real PDF without an X server
        env:
          SARAND_REAL_PDF_ENGINES: wkhtmltopdf
        run: python -m pytest -q tests/test_pdf_real_engines.py

  kube:
    name: Kubernetes tools (real ones)
    # The mocked tests pin sarand's wiring; this job runs the real helm and
    # kubeconform against a one-file local schema, so the flags, the schema layout
    # and the summary format are proven (backlog item 5, round R10c).
    # ابزارهای واقعی روی یک schema محلی؛ flagها و قالب خروجی اینجا اثبات می‌شوند.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the real tools and sarand
        run: |
          helm version --short
          bash scripts/ci_install_kubeconform.sh
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev]"

      - name: helm and kubeconform check a real chart
        env:
          SARAND_REAL_KUBECONFORM: "1"
        run: python -m pytest -q tests/test_kubeconform_real.py

  compose:
    name: Docker Compose (real docker)
    # The mocked tests pin sarand's wiring; this job runs the real
    # `docker compose config` so the flags and the "required variable is not an
    # error" assumption are proven (backlog item 13, round R10e).
    # docker واقعی؛ flagها و فرض «متغیر الزامی خطا نیست» اینجا اثبات می‌شوند.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install sarand
        run: |
          docker compose version
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev]"

      - name: docker compose config checks real files
        env:
          SARAND_REAL_COMPOSE: "1"
        run: python -m pytest -q tests/test_compose_real.py

  turbo:
    name: Turborepo (real, pinned version)
    # Evidence of compatibility, not proof for every version: sarand's reading of
    # turbo.json is compared with Turborepo's own resolved task definitions on one
    # fixture (backlog item 1, round R12).
    # شاهد سازگاری برای یک نسخه‌ی پین‌شده؛ نه اثبات برای همه‌ی نسخه‌ها.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pinned Turborepo and sarand
        run: |
          bash scripts/ci_install_turbo.sh
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev]"

      - name: sarand's reading of turbo.json matches the real Turborepo
        env:
          SARAND_REAL_TURBO: "1"
        run: python -m pytest -q tests/test_monorepo_real.py

  quality:
    name: quality (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The experimental entry (Python 3.15) may fail without failing the workflow.
    # ورودی آزمایشی (پایتون ۳.۱۵) می‌تواند بدون شکست‌دادن workflow شکست بخورد.
    continue-on-error: ${{ matrix.experimental == true }}
    # A hung test must fail the job in minutes, not run for hours (a Windows
    # job once ran for ~7 hours). Normal runs take about 3-4 minutes.
    # یک تست گیرکرده باید در چند دقیقه job را fail کند، نه ساعت‌ها اجرا شود
    # (یک job ویندوز یک‌بار حدود ۷ ساعت اجرا شد). اجرای عادی حدود ۳-۴ دقیقه است.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Every OS on one Python, plus the oldest and newest supported Python
        # on Linux -- `requires-python` is >=3.11, so 3.11 must really work.
        # ubuntu is pinned so the "ubuntu-latest" migration to a new release
        # cannot change results by surprise; bump it deliberately.
        # هر OS روی یک نسخه‌ی پایتون، به‌علاوه‌ی قدیمی‌ترین و جدیدترین پایتونِ
        # پشتیبانی‌شده روی Linux -- `requires-python` برابر >=3.11 است، پس
        # 3.11 باید واقعاً کار کند. ubuntu ثابت شده تا مهاجرت "ubuntu-latest"
        # به نسخه‌ی جدید نتایج را ناگهانی عوض نکند؛ عمداً ارتقایش بده.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.14"
          # Python 3.15 is out (October 2026). Informative only: a failure here
          # must not turn the workflow red or block a release.
          # پایتون ۳.۱۵ منتشر شده؛ فقط اطلاع‌رسانی است و نباید جلوی انتشار را بگیرد.
          - os: ubuntu-24.04
            python-version: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python tooling
        # ".[dev]" is pyproject.toml's single source of truth for which
        # tools CI (and any human) needs -- see the comment next to it.
        # ".[dev]" منبع واحد pyproject.toml برای این است که CI (و هر
        # انسانی) به چه ابزارهایی نیاز دارد -- کامنت کنار آن را ببینید.
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run mypy
        run: mypy .

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Run Rust tests
        run: cargo test

      - name: Run Rust Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build the release wheel
        # Build the actual distributable artifact before testing the installed package.
        # ساخت artifact واقعی قابل توزیع قبل از تست کردن package نصب‌شده.
        run: maturin build --release --out dist

      - name: Check the package metadata (PyPI readiness)
        # `twine check --strict` renders the README the way PyPI does and
        # rejects malformed metadata. The sdist is built too: it is what a
        # source install uses, and a release uploads it next to the wheels.
        # twine بنا بر rendering PyPI، README و metadata را می‌سنجد؛ sdist هم
        # ساخته می‌شود چون نصب از سورس و انتشار از آن استفاده می‌کنند.
        run: |
          python -m pip install twine
          maturin sdist --out dist-sdist
          twine check --strict dist/* dist-sdist/*

      - name: Install the built wheel
        run: python -m pip install dist/*.whl

      - name: Fresh-install smoke test
        # Installs ONLY the built wheel into a brand-new virtualenv and uses
        # it, so a runtime dependency missing from pyproject.toml cannot hide
        # behind the dev dependencies of this job.
        # فقط wheel ساخته‌شده را در virtualenv کاملاً تازه نصب و استفاده می‌کند
        # تا وابستگی اعلام‌نشده پشت وابستگی‌های dev این job پنهان نماند.
        run: python scripts/smoke_install.py dist

      - name: Run the full Python test suite
        # Plain pytest runs the complete suite, including slow_external tests.
        # اجرای ساده pytest کل suite را شامل تست‌های slow_external اجرا می‌کند.
        # `faulthandler_timeout` prints every thread's stack if one test runs
        # longer than 90 s, so a hang names its own culprit in the log.
        # `faulthandler_timeout` اگر یک تست بیش از ۹۰ ثانیه طول بکشد stack همه‌ی
        # threadها را چاپ می‌کند، تا گیرکردن خودش مقصرش را در لاگ نشان دهد.
        # `-rfE` + `tee`: the log is kept in pytest.log so the next step can
        # copy just the failed tests into the job summary.
        # `-rfE` + `tee`: لاگ در pytest.log نگه داشته می‌شود تا گام بعدی فقط
        # تست‌های شکست‌خورده را به خلاصه‌ی job کپی کند.
        run: pytest -v -rfE -o faulthandler_timeout=90 2>&1 | tee pytest.log

      - name: List failed tests in the job summary
        # Long logs are hard to copy from a phone; the Summary page of the run
        # shows this short list at the top. The `cut -c1-220` here is exactly
        # what made three separate rounds of a Windows-only sarif.json
        # mismatch undiagnosable from the phone: every assertion detail past
        # column 220 -- the actual differing content, however much clearer
        # the local assertion message was made -- was silently dropped
        # before it ever reached this summary. Not a GitHub limitation; a
        # limitation of this exact line. The full `pytest.log` artifact
        # uploaded below is the fix for when this short list isn't enough.
        # کپی‌کردن لاگ‌های بلند از موبایل سخت است؛ صفحه‌ی Summary اجرا این
        # فهرست کوتاه را در بالا نشان می‌دهد. همین `cut -c1-220` دقیقاً همان
        # چیزی بود که سه دور جداگانه از ناهم‌خوانیِ sarif.json مخصوص ویندوز
        # را از روی موبایل غیرقابل‌تشخیص کرد: هر جزئیاتِ assertion بعد از
        # ستون ۲۲۰ -- محتوای واقعاً متفاوت، هرقدر هم پیام assertion محلی
        # روشن‌تر شده باشد -- بی‌سروصدا پیش از رسیدن به این خلاصه حذف
        # می‌شد. محدودیت گیت‌هاب نبود؛ محدودیت همین یک خط بود. artifact
        # کامل `pytest.log` که پایین‌تر آپلود می‌شود، رفعِ همان زمانی است
        # که این فهرست کوتاه کافی نباشد.
        if: failure()
        run: |
          {
            echo "### Failed tests (${{ matrix.os }}, py${{ matrix.python-version }})"
            echo '```text'
            grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-220 || true
            grep -E "^=+ .*(failed|passed|error).* =+$" pytest.log || true
            echo '```'
            echo ""
            echo "Full untruncated log: see the \`pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}\` artifact on this run's Summary page (Artifacts section, bottom of the page)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full test log
        # The short summary above is deliberately truncated for phone
        # reading; this artifact is the untruncated `pytest.log` for when
        # that isn't enough -- download from this run's Summary page,
        # Artifacts section (bottom of the page), no need to scroll a raw
        # log on a phone screen at all.
        # خلاصه‌ی کوتاه بالا عمداً برای خواندن از موبایل بریده شده است؛ این
        # artifact همان `pytest.log` بدون‌برش است برای وقتی آن کافی نیست --
        # از صفحه‌ی Summary همین اجرا، بخش Artifacts (پایین صفحه) دانلود
        # کنید، بدون هیچ نیازی به اسکرول یک لاگ خام روی صفحه‌ی موبایل.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-log-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest.log
          retention-days: 14
          # `failure()` can also fire from a step *before* pytest ever ran
          # (e.g. a build/install failure) -- pytest.log would not exist
          # yet then. `warn` avoids turning that into a second, confusing
          # "artifact not found" failure on top of the real one.
          # `failure()` می‌تواند از یک گام *پیش از* اجرای pytest هم شلیک
          # کند (مثلاً شکست build/install) -- آنگاه pytest.log هنوز وجود
          # ندارد. `warn` از تبدیل‌شدن آن به یک شکست دوم و گیج‌کننده‌ی
          # «artifact پیدا نشد» روی شکستِ واقعی جلوگیری می‌کند.
          if-no-files-found: warn

  # Checks that read the repository as it is and need no build. A separate job
  # so they run once, not per matrix entry, and so every failing check is
  # reported in one run (each step after the first runs even if one failed).
  # بررسی‌هایی که مخزن را همان‌طور که هست می‌خوانند و build نمی‌خواهند؛ job جدا تا
  # یک‌بار اجرا شوند و همه‌ی خطاها در همان اجرا گزارش شود.
  static:
    name: static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans the whole history, not only the last commit.
          # gitleaks کل تاریخچه را می‌گردد، نه فقط آخرین commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: python -m pip install "bandit>=1.9"

      - name: bandit (security linter for our own Python)
        run: bandit -c pyproject.toml -r python scripts -q

      - name: markdownlint (documentation)
        if: ${{ !cancelled() }}
        run: npx --yes markdownlint-cli@0.48.0 "**/*.md"

      - name: actionlint (workflow syntax and embedded shell)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      - name: Set up Rust
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache the cargo-deny binary
        id: cargo-deny-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          # Bump the number to pick up a newer cargo-deny on purpose.
          # برای گرفتن cargo-deny جدیدتر، عدد را عمداً زیاد کنید.
          key: cargo-deny-${{ runner.os }}-v1

      - name: Install cargo-deny
        if: ${{ !cancelled() && steps.cargo-deny-cache.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-deny

      - name: cargo deny (licenses, bans, sources)
        if: ${{ !cancelled() }}
        # Advisories live in audit.yml: they need the network and must not
        # turn an ordinary push red.
        # advisoryها در audit.yml هستند: به شبکه نیاز دارند و نباید push معمولی را قرمز کنند.
        run: cargo deny check licenses bans sources

      - name: gitleaks (secrets in the whole history)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

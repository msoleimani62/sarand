name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install maturin and pytest
        run: pip install maturin pytest

      - name: Build the Rust core (release, matches AGENTS.md Phase G smoke test)
        run: maturin develop --release

      - name: Run the full test suite
        # Plain pytest runs everything by default (AGENTS.md §4.8) --
        # CI is exactly the scheduled safety net that makes running the
        # slow_external tests (real cargo-audit, etc.) here, on every
        # push, the right tradeoff even though they're skipped locally
        # during quick iteration.
        run: pytest -v

      - name: Confirm a release wheel actually builds
        run: maturin build --release

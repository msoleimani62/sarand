name: Release

# Builds the wheels and the source distribution and publishes them to PyPI with
# trusted publishing: no API token is stored anywhere (docs/PUBLISHING.md).
#   - A pushed tag `vX.Y.Z` builds everything and publishes to PyPI, after the
#     approval the `pypi` environment asks for.
#   - Run manually (Actions -> Release -> Run workflow) it only builds; tick
#     the box to also upload to TestPyPI, the dry run for a real release.
# ساخت wheel و sdist و انتشار با trusted publishing؛ هیچ توکنی ذخیره نمی‌شود.
#   - push تگ `vX.Y.Z` همه‌چیز را می‌سازد و بعد از تأیید environment به نام `pypi` در PyPI منتشر می‌کند.
#   - اجرای دستی فقط می‌سازد؛ با تیک گزینه به TestPyPI هم می‌فرستد (تمرین انتشار).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Also upload to TestPyPI (a dry run; PyPI only publishes from a tag)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # bash on every OS, as in ci.yml: PowerShell (the Windows default) does not
    # expand `dist/*.whl` for a native command, and pip then fails.
    # bash روی همه‌ی سیستم‌ها؛ PowerShell الگوی `dist/*.whl` را باز نمی‌کند.
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag must name the package version
        # A tag that disagrees with pyproject.toml must never reach PyPI.
        # تگی که با pyproject.toml نمی‌خواند هرگز نباید به PyPI برسد.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the package version v$version" >&2
            exit 1
          fi

  ci-gate:
    name: CI must be green for this commit
    # A tag is only released if the CI workflow succeeded for the commit it
    # names (scripts/release.py checks the same thing on the maintainer's
    # machine; this is the same rule enforced where it cannot be skipped).
    # تگ فقط وقتی منتشر می‌شود که CI برای همان commit موفق بوده باشد.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --json conclusion --jq '.[].conclusion')"
          echo "CI conclusions for $GITHUB_SHA: ${conclusions:-none}"
          if ! grep -qx success <<< "$conclusions"; then
            echo "No successful CI run for $GITHUB_SHA; refusing to publish." >&2
            exit 1
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-24.04, target: aarch64, manylinux: auto }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - name: Build the wheel
        # One abi3 wheel per platform covers every Python from 3.11 on
        # (pyproject.toml enables pyo3/abi3-py311), so it also cross-compiles.
        # یک wheel با abi3 برای هر پلتفرم، همه‌ی پایتون‌های ۳.۱۱ به بالا را پوشش می‌دهد.
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.name }}
          path: dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist

  smoke:
    name: Smoke test (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, python: "3.11", artifact: dist-wheels-linux-x86_64 }
          - { runner: ubuntu-24.04, python: "3.14", artifact: dist-wheels-linux-x86_64 }
          - { runner: macos-latest, python: "3.11", artifact: dist-wheels-macos-arm64 }
          - { runner: windows-latest, python: "3.11", artifact: dist-wheels-windows-x64 }
          # The two wheels that are cross-built get a native smoke test too.
          # دو wheelای که cross-build می‌شوند روی runner بومی هم smoke test می‌شوند.
          - { runner: ubuntu-24.04-arm, python: "3.12", artifact: dist-wheels-linux-aarch64 }
          - { runner: macos-15-intel, python: "3.12", artifact: dist-wheels-macos-x86_64 }
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: The command runs and the compiled core is inside the wheel
        run: |
          sarand --version
          python -c "import sarand._core as core; print('Rust core:', core.__file__)"
      - name: The wheel names the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import os, sarand; ref = os.environ['GITHUB_REF_NAME']; assert ref == 'v' + sarand.__version__, (ref, sarand.__version__)"

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sarand-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, smoke, ci-gate]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/sarand-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: GitHub Release
    # Only after PyPI accepted the files, and only for a real tag: a TestPyPI
    # dry run never creates a release. The release carries the same wheels and
    # sdist plus SHA256SUMS, and its notes are the CHANGELOG section.
    # فقط بعد از پذیرش PyPI و فقط برای تگ واقعی؛ نسخه‌ی آزمایشی TestPyPI هرگز release نمی‌سازد.
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found = 1; next} found && /^## \[/ {exit} found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md." > release-notes.md; fi
      - name: Create (or update) the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi

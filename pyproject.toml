[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sarand"
version = "0.1.0"
description = "Cross-platform CLI that scans any project, detects its architecture, runs its tests, and generates an AI-ready intelligence report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "project-analysis", "ai-context", "code-intelligence", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich>=13.0",
]

# project.urls intentionally omitted -- no GitHub remote exists yet.
# Add e.g. Repository = "https://github.com/<user>/sarand" once it does.

[project.scripts]
sarand = "sarand.cli:main"

[tool.maturin]
# Standard maturin "mixed Rust/Python" layout:
#   ./src/            -> Rust crate (compiles to sarand._core)
#   ./python/sarand/  -> pure-Python package
python-source = "python"
module-name = "sarand._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow_external: exercises a real external tool when it happens to be installed (e.g. cargo-audit fetching the advisory DB) -- can take minutes. Included by default (plain `pytest` must mean 'the whole suite ran'); use -m 'not slow_external' for a fast subset during local iteration.",
]

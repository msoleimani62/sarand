[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "sarand"
version = "0.6.0"
description = "Cross-platform CLI that scans any project, detects its architecture, runs its tests, and generates an AI-ready intelligence report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "project-analysis", "ai-context", "code-intelligence", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "filelock==3.32.3",
    "rich>=13.0",
    "tomli>=2.0; python_version < \"3.11\"",
]

# Single source of truth for local dev / CI setup: `pip install -e ".[dev]"`.
# Deliberately does NOT include pytest-asyncio/anyio -- every test in this
# suite wraps async code with `asyncio.run(...)` inside a plain sync `def
# test_...()` (see AGENTS.md §4.7 and any tests/test_*.py file), so no
# pytest async plugin is ever required. If a future test reaches for
# `async def test_...` + `@pytest.mark.asyncio` instead, that is the bug to
# fix (convert it to asyncio.run), not a missing dependency here.
#
# منبع واحد برای راه‌اندازی dev محلی / CI: `pip install -e ".[dev]"`.
# عمداً pytest-asyncio/anyio را شامل نمی‌شود -- هر تستی در این suite کد
# async را با `asyncio.run(...)` داخل یک `def test_...()` معمولی sync
# می‌پیچد (AGENTS.md §4.7 و هر فایل tests/test_*.py را ببینید)، پس هیچ‌وقت
# نیازی به پلاگین async پایتست نیست. اگر تستی در آینده به‌جای این، سراغ
# `async def test_...` + `@pytest.mark.asyncio` رفت، همان چیزی است که باید
# اصلاح شود (تبدیل به asyncio.run)، نه یک وابستگی جاافتاده اینجا.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=1.10",
    "bandit>=1.9",
    "pip-audit>=2.10",
]

[project.urls]
Repository = "https://github.com/msoleimani62/sarand"
Issues = "https://github.com/msoleimani62/sarand/issues"

[project.scripts]
sarand = "sarand.cli:main"

[tool.maturin]
# Standard maturin "mixed Rust/Python" layout.
# ساختار استاندارد maturin برای پروژه ترکیبی Rust/Python.
python-source = "python"
module-name = "sarand._core"
features = ["pyo3/extension-module"]

[tool.ruff]
# tests/golden/ holds byte-exact recorded renderer OUTPUT (see
# tests/golden/README.md), not authored source -- some of it is
# Python source embedded verbatim inside a report's markdown fences.
# ruff format (>=0.16) reformats Python it finds inside .md code
# fences by default, which would silently rewrite what the golden
# test asserts every time `ruff format .` runs, turning a passing
# snapshot into a failing one with no code change involved. Excluding
# the directory here is the fix, not hand-editing the snapshot to
# match ruff's preferred style: the snapshot's job is to record
# exactly what the renderer produces, unedited.
#
# tests/golden/ خروجیِ بایت‌به‌بایت ضبط‌شده‌ی رندرکننده‌هاست (به
# tests/golden/README.md نگاه کنید)، نه سورسِ نوشته‌شده‌ی دست -- بخشی
# از آن، سورس پایتونیِ جاسازی‌شده‌ی عیناً داخل fenceهای مارک‌داونِ یک
# گزارش است. ruff format (>=0.16) به‌طور پیش‌فرض پایتونیِ داخل
# fenceهای کد فایل‌های .md را بازفرمت می‌کند که هر بار اجرای
# `ruff format .` بی‌آنکه کدی تغییر کرده باشد، همان چیزی را که تست
# golden ادعا می‌کند خاموشانه بازمی‌نویسد و یک snapshot سالم را خراب
# می‌کند. حذف این پوشه از دامنه‌ی ruff همان رفعِ درست است، نه ویرایش
# دستیِ snapshot برای تطبیق با سبک ترجیحیِ ruff: وظیفه‌ی snapshot
# ثبتِ دقیقِ همان چیزی است که رندرکننده تولید می‌کند، بدون ویرایش.
extend-exclude = ["tests/golden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow_external: exercises a real external tool when it happens to be installed (e.g. cargo-audit fetching the advisory DB) -- can take minutes. Included by default (plain `pytest` must mean 'the whole suite ran'); use -m 'not slow_external' for a fast subset during local iteration.",
]

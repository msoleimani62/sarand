# License policy for sarand itself (see README, "License policy").
# The licenses below are the ones a real `sarand --full` SBOM listed.
# سیاست لایسنس برای خودِ sarand (بخش «سیاست لایسنس» در README). لایسنس‌های
# زیر همان‌هایی‌اند که یک SBOM واقعیِ `sarand --full` فهرست کرد.

[licenses]
allow   = ["MIT", "Apache-2.0", "BSD-*", "ISC", "PSF-2.0"]
deny    = ["AGPL-*", "GPL-*", "SSPL-*"]
warn    = ["MPL-2.0"]
# syft reads no license for Rust crates (Cargo.lock carries none); cargo-deny
# (deny.toml) is the authority for those.
# syft برای crate های Rust لایسنسی نمی‌خواند (Cargo.lock ندارد)؛ مرجعِ آن‌ها
# cargo-deny است (deny.toml).
unknown = "allow"

# tests/test_secrets.py holds deliberately fake credentials (it proves that the
# secret scan detects them). Findings in exactly this file do not lower the
# health score; they are still listed and the file is still never embedded.
# tests/test_secrets.py اعتبارنامه‌ی جعلی عمدی دارد (ثابت می‌کند اسکن آن‌ها را
# پیدا می‌کند). یافته‌های دقیقاً همین فایل امتیاز را کم نمی‌کنند؛ همچنان
# فهرست می‌شوند و فایل همچنان هرگز embed نمی‌شود.
[secrets]
fixture_paths = ["tests/test_secrets.py"]

# Two test files are full of TODO/FIXME strings on purpose (they test how
# markers are counted); they would otherwise swamp sarand's own report.
# دو فایل تست عمداً پر از رشته‌ی TODO/FIXME هستند (شمارش marker را تست می‌کنند)
# و گزارش خودِ sarand را پر می‌کردند.
[todo]
exclude_globs = ["tests/test_health.py", "tests/test_todo_filter.py"]
